[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-icloud-caldav"
version = "0.3.0"
description = "Kalends calendar sidebar and iCloud CalDAV tools for Hermes"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "icalendar>=6,<8",
  "python-dateutil>=2.9,<3",
  "recurring-ical-events>=3.3,<4",
]

[tool.setuptools]
packages = ["icloud_caldav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
